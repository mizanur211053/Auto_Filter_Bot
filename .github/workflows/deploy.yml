name: Sync to Hugging Face Spaces

on:
  push:
    branches: [DreamXBotz]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://mizanur211053:$HF_TOKEN@huggingface.co/spaces/mizanur211053/Movixuniverse_search_bot DreamXBotz:main
